<h1>{{ monthName }}</h1>
<div  style="display: flex; flex-direction: row;">
    @for(currentDay of daysOfTheWeek; track $index){
        <div style="width: 25px;">
            {{ currentDay }}
        </div>
    }
</div>

<div style="display: flex; flex-direction: row; flex-wrap: wrap;">
    @for(currentDay of daysOfMonth; track $index){
        @if(currentDay.dayNumber < 0){
            <div style="width: 25px;"></div>
        }@else if(($index + 1) % 7 != 0){
            <button style="width: 25px;" (click)="goToDay(currentDay.dayNumber)">
                {{ currentDay.dayNumber }}
            </button>
        }@else{
            <button (click)="goToDay(currentDay.dayNumber)">
                {{ currentDay.dayNumber }}
            </button>
            <div style="flex-basis: 100%; height: 0;"></div>
        }
    }
</div>
