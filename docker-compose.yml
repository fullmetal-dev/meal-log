version: "3.9"
services:
    api:
        container_name: meallog_api
        build:
            context: ./API
        ports:
            - 8080:8080
        environment:
            - DOTNET_ENVIRONMENT=${DOTNET_ENVIRONMENT:-Staging}
        develop:
            watch:
                - action: rebuild
                  path: .
    front:
        container_name: meallog_front
        build:
            context: ./meal-log-front
        ports:
            - 4000:4000
        depends_on:
            - api